[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webanno-spacy-converter"
version = "0.2.0"
description = "Convert between WebAnno TSV and spaCy formats with NER/NEL support"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "SasaP"}
]
keywords = ["webanno", "spacy", "nlp", "ner", "nel", "annotation", "corpus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.8"
dependencies = [
    "spacy>=3.5",
    "cyrtranslit>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
webanno-to-spacy = "webanno_spacy_converter.cli:main"
webanno-to-spacy-gui = "webanno_spacy_converter.gui:run_gui"

[project.urls]
Homepage = "https://github.com/te-sla/webanno-spacy-converter"
Repository = "https://github.com/te-sla/webanno-spacy-converter"
Issues = "https://github.com/te-sla/webanno-spacy-converter/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["webanno_spacy_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
